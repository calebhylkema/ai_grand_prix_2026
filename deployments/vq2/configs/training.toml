# VQ2 TRAINING config — development runs against the sim in Training mode.
# Complete and standalone (no layering). Flight values carried over VERBATIM from
# the flight-validated fly2.py controller (2026-07-09 restructure) — the tuning
# history lives in mission.py's docstrings and docs/project/status.md.
# Units: SI (m, s, rad) except accept_turn_deg (degrees, converted at load).

name = "training"

[mission]
cmd_hz = 60.0
stab_secs = 1.5      # pre-launch attitude-filter settle

# --- G0: launch-assisted gate-0 thread (proven 100%) ---
kp_yaw = 1.5         # yaw rate per rad of bearing (+bearing = gate right = +yaw)
pitch_fwd = -0.05    # gentle forward commit when aligned
align_bear = 0.22    # rad — forward pitch only when roughly nose-on
cy_band = 60.0       # px — and vertically centred (aim-then-go)

# --- BRAKE: kill the launch momentum right after a gate pass (arrest-then-look) ---
brake_secs = 1.6
brake_pitch = 0.35        # rad nose-up ≈3.6 m/s² decel (+0.15 too weak for the catapult exit)
brake_arrest_s = 1.0      # blind-flare portion: bounded climb impulse against the ~-2 m/s sink
brake_arrest_thr = 0.04   # thrust above hover during the arrest
brake_tail_pitch = 0.10   # nose back down enough that the cyan ribbon returns to view

# --- SCAN: yaw toward the mapped next-gate bearing until a map-valid detection ---
scan_yaw = 0.5            # rad/s
scan_hold_pitch = 0.0     # LEVEL while turning (batch 7: nose-up drift fed the orbit)

# --- THREAD: servo onto the acquired gate ---
kp_roll_bear = 0.30       # bank toward the gate — banking bends the VELOCITY vector
recenter_pitch = 0.15     # close-but-off-centre brake (deep flare pushed the gate out of frame)
accept_depth_m = [3.0, 13.0]  # camera-Z depth, NOT slant range; legacy association only
accept_turn_deg = [25.0, 110.0]  # mapped corner window right of the exit heading
target_hold_s = 0.8       # sighting persistence
lost_brake_s = 0.8        # target stale mid-thread: brake level this long, then re-SCAN
pass_area = 15000.0       # px² — close enough to commit straight through
pass_range_m = 3.5
pass_commit_s = 1.2       # hands-off straight-and-level budget through the gate plane

[run]
secs = 45.0               # attempt duration cap (s)
attempts = 1
trace = true              # dump trace frames to .local/datasets/vq2/fly_trace
mavlink_endpoint = "udpin:127.0.0.1:14550"
# Permission is not activation: the CLI must also pass --experimental-transition-authority.
permit_transition_authority = true
# Training-only visual gate-0→1 handoff. Permission only; the CLI must also pass
# --experimental-visual-handoff, and it is mutually exclusive with transition authority.
permit_visual_handoff = true
