[project]
name = "ai-grand-prix"
version = "0.1.0"
description = "Autonomous drone racing stack for the Anduril AI Grand Prix 2026"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "pydantic>=2.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
perception = [
    "onnxruntime>=1.17",
    "ultralytics>=8.1",       # YOLOv8 for training
    "albumentations>=1.3",    # Data augmentation
]
control = [
    "casadi>=3.6",            # NMPC/MPCC solver
]
rl = [
    "torch>=2.2",
    "stable-baselines3>=2.2",
    "gymnasium>=0.29",
]
viz = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
all = [
    "ai-grand-prix[perception,control,rl,viz,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drone_racing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["drone_racing"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cv2.*", "casadi.*", "onnxruntime.*", "ultralytics.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "simulation: marks tests that require the full simulator (deselect with '-m not simulation')",
    "slow: marks tests that take >10s",
    "benchmark: marks latency benchmarks",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["drone_racing"]
omit = ["drone_racing/logging/*"]

[tool.coverage.report]
fail_under = 80
