name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # 11 pre-existing errors in the pre-sim lineage library (numpy/cv2 stub
      # friction) — tracked as reorg debt; non-blocking until burned down.
      - name: Mypy type check
        run: uv run mypy src/drone_racing
        continue-on-error: true

      - name: Pytest (non-simulation)
        run: uv run pytest tests/ -m "not simulation" --cov=drone_racing --cov-report=xml

      - name: Coverage check
        run: uv run coverage report

      - name: Build package
        run: uv build

      - name: Console-script smoke tests
        run: |
          uv run aigp-vq2 --help
          uv run aigp-calibrate --help
          uv run aigp-replay --help
          uv run aigp-train-detector --help
          uv run aigp-benchmark --help
